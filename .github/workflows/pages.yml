name: Publish game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check mouse controls
        run: node port/tests/test_mouse.mjs
      - name: Check full-screen controls
        run: node port/tests/test_fullscreen.mjs
      - name: Check automatic downloads
        run: node port/tests/test_downloads.mjs
      - name: Download game runtime data
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download game-data-1.65 --pattern orderup-game-data-1.65.zip --dir _runtime
      - name: Verify and unpack game runtime data
        run: python3 tools/package_game_data.py --extract _runtime/orderup-game-data-1.65.zip
      - name: Package player
        run: node tools/package_pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
