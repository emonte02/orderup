<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Order Up!! To Go</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#050706;color:#f4f0df}*{box-sizing:border-box}html,body,main{margin:0;width:100%;height:100%;overflow:hidden}button{cursor:pointer;border:0;border-radius:8px;padding:12px 22px;background:#e7b556;color:#201a10;font:600 16px system-ui}button:disabled{opacity:.65;cursor:wait}button:focus-visible{outline:3px solid #fff;outline-offset:4px}[hidden]{display:none!important}
.game-surface{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#050706}canvas{display:block;width:min(100vw,150vh);height:min(100vh,66.666667vw);width:min(100dvw,150dvh);height:min(100dvh,66.666667dvw);touch-action:none;background:#080a09;flex:none}
.loading-panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#080a09f5;z-index:2}.loading-card{width:min(100%,440px);text-align:center}.loading-card h1{font-size:clamp(25px,5vw,34px);margin:0 0 30px}.loading-card h2{font-size:21px;margin:0 0 12px}.loading-card p{color:#c3c7b9;line-height:1.5;margin:12px 0}.loading-card button{margin-top:22px;min-width:160px}.loading-meter{margin-top:24px}.loading-meter progress{display:block;appearance:none;-webkit-appearance:none;width:100%;height:12px;border:0;border-radius:20px;overflow:hidden;background:#343c34}.loading-meter progress::-webkit-progress-bar{background:#343c34;border-radius:20px}.loading-meter progress::-webkit-progress-value{background:#e7b556;border-radius:20px;transition:width .15s linear}.loading-meter progress::-moz-progress-bar{background:#e7b556;border-radius:20px}.loading-meter progress:indeterminate{background:linear-gradient(100deg,#343c34 30%,#e7b556 50%,#343c34 70%);background-size:200% 100%;animation:loading-sweep 1.5s linear infinite}.loading-meter progress:indeterminate::-webkit-progress-bar{background:inherit}.loading-meter progress:indeterminate::-moz-progress-bar{background:transparent}.loading-meta{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:13px;color:#a5ad9b;font-variant-numeric:tabular-nums}.loading-card .controls-hint{font-size:13px;margin-top:20px}
.viewport-controls{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:3}.viewport-controls button{display:flex;align-items:center;gap:8px;padding:9px 13px;background:#202724dc;border:1px solid #69705c;color:#f4f0df;font-size:13px;box-shadow:0 2px 12px #0004}.viewport-controls svg{width:18px;height:18px}.playing .viewport-controls{opacity:.55;transition:opacity .15s}.playing .viewport-controls:hover,.playing .viewport-controls:focus-within{opacity:1}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}#status.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);height:auto;padding:12px 18px;margin:0;clip:auto;white-space:normal;overflow:visible;background:#202724ee;border-radius:8px;z-index:4;color:#f4f0df;text-align:center}
.activity-indicator{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#151918ee;border-radius:8px;color:#f4f0df;font-size:14px;pointer-events:none}.loading-spinner{width:16px;height:16px;border:2px solid #454c40;border-top-color:#e7b556;border-radius:50%;animation:loading-turn 1s linear infinite}
dialog{color:#f4f0df;background:#202724;border:1px solid #526052;border-radius:12px;padding:24px;max-width:min(620px,85vw);max-height:80vh}dialog::backdrop{background:#000a}dialog h2{margin:0 0 16px}#notice-body{white-space:pre-line;line-height:1.5}#notice-body ol{padding-left:22px}#notice-body li{margin:12px 0}#notice-body li p{margin:4px 0;font-size:14px}#notice-close{margin-top:18px}@keyframes loading-turn{to{transform:rotate(360deg)}}@keyframes loading-sweep{to{background-position:-200% 0}}@media(prefers-reduced-motion:reduce){.loading-spinner,.loading-meter progress:indeterminate{animation:none}.playing .viewport-controls,.loading-meter progress::-webkit-progress-value{transition:none}}@media(max-height:420px){.loading-card h1{margin-bottom:14px}.loading-meter{margin-top:14px}.loading-card .controls-hint{display:none}}
.loading-panel{overflow-y:auto}.loading-card{margin:auto}
.viewport-controls{display:flex;gap:8px;white-space:nowrap}.tutorial-overlay{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(68px,env(safe-area-inset-bottom));z-index:3;max-width:calc(100vw - 24px);padding:12px;background:#202724ed;border:1px solid #69705c;border-radius:12px;box-shadow:0 2px 12px #0004}.tutorial-overlay button{width:100%;padding:10px 18px}.tutorial-overlay p{font-size:12px;color:#c3c7b9;margin:8px 0 0;text-align:center}
</style>
<main>
 <p id="status" class="sr-only" role="status">Loading game files…</p>
 <div class="game-surface">
  <canvas width="960" height="640" aria-label="Order Up game"></canvas>
  <section id="loading-panel" class="loading-panel" aria-labelledby="loading-title">
   <div class="loading-card">
    <h1>Order Up!! To Go</h1>
    <h2 id="loading-title">Loading game files…</h2>
    <p id="loading-detail">Getting your game ready.</p>
    <div id="loading-meter" class="loading-meter">
     <progress id="loading-progress" max="100" value="0" aria-labelledby="loading-title"></progress>
     <div class="loading-meta"><span id="loading-amount">0%</span><span id="loading-elapsed">0 seconds elapsed</span></div>
    </div>
    <button id="start">Start game</button>
    <p class="controls-hint">Click and drag to cook. Right-click or press Esc to go back.<br>Progress saves on this computer.</p>
   </div>
  </section>
  <div id="activity-indicator" class="activity-indicator" hidden role="status"><span class="loading-spinner" aria-hidden="true"></span><span>Loading…</span></div>
 </div>
 <div class="viewport-controls"><button id="fullscreen" type="button" aria-label="Enter full screen" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6"/></svg><span id="fullscreen-label">Full screen</span></button><button id="tutorial-preference" type="button" aria-label="Automatically skip the introductory tutorial" aria-pressed="false" title="Remember whether to skip the introductory tutorial on this browser" disabled>Tutorial: play</button></div>
 <section id="tutorial-overlay" class="tutorial-overlay" aria-label="Tutorial controls" hidden><button id="skip-tutorial" type="button" aria-describedby="tutorial-hint">Skip tutorial</button><p id="tutorial-hint">Remember this choice on this browser.</p></section>
 <dialog id="notice"><h2 id="notice-title"></h2><div id="notice-body"></div><button id="notice-close">Continue</button></dialog>
</main>
<script type="module" src="./app.mjs"></script>
</html>
